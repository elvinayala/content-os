<!doctype html>
<html lang="es-PR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resuelto · Proveedores</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F3D5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Resuelto">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--c1:#0F3D5E;--c2:#F2621F;--c6:#1F9D6B;--night:#071B2C;--surface:#0C2A42;--line:rgba(255,255,255,.14);--ink:#EAF2F8;--ink2:#9FB8CA;--ink3:#6E8AA0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--night);color:var(--ink);font-size:16px;line-height:1.45;padding-bottom:60px}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(7,27,44,.92);backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:8px;font-family:Sora;font-weight:800;font-size:22px;letter-spacing:-.03em}.logo svg{width:28px;height:28px}
.logo small{font-family:'DM Sans';font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c2);border-left:1px solid var(--line);padding-left:8px;margin-left:2px}
#quien{font-size:14px;color:var(--ink2)}
main{max-width:720px;margin:0 auto;padding:18px}
h2{font-family:Sora;font-size:18px;font-weight:700;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.card b.id{font-family:Sora;color:var(--c2);font-size:13px;letter-spacing:.06em}
.card h3{font-family:Sora;font-size:17px;font-weight:700;margin:4px 0 6px}
.card p{color:var(--ink2);font-size:14.5px}
.pago{font-family:Sora;font-weight:800;font-size:24px;color:#fff;white-space:nowrap}.pago small{display:block;font-family:'DM Sans';font-weight:500;font-size:11px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:13.5px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--c2);color:#fff;font-weight:600;border:0;border-radius:12px;padding:14px 18px;font:inherit;cursor:pointer;width:100%;margin-top:14px;font-size:16px}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--ink2)}
.tag.ok{background:rgba(31,157,107,.2);color:#63D6A6}.tag.warn{background:rgba(242,98,31,.18);color:#FF9660}
.vacio{color:var(--ink3);font-size:14.5px;padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
.timer{font-variant-numeric:tabular-nums;color:#FF9660;font-weight:600}
.aviso{background:rgba(31,157,107,.16);color:#7EE0B4;border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:12px;display:none}
.error{background:rgba(185,74,36,.2);color:#FFB39A}
.banner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:none;gap:12px;align-items:center;justify-content:space-between}
.banner p{font-size:14px;color:var(--ink2);margin:0}.banner b{color:#fff;display:block;font-family:Sora;font-size:15px}
.banner button{background:var(--c2);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.cli{background:rgba(255,255,255,.04);border-radius:12px;padding:12px;margin-top:12px;font-size:14.5px}.cli a{color:#FF9660;text-decoration:none;font-weight:600}
.pasos{display:flex;gap:6px;margin-top:12px}.pasos span{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.12)}.pasos span.on{background:var(--c2)}
.fotos{display:flex;gap:8px;margin-top:12px}.fotos label{flex:1;text-align:center;border:1.5px dashed var(--line);border-radius:12px;padding:12px 6px;font-size:13.5px;cursor:pointer}.fotos input{display:none}
.campo{margin-top:10px}.campo label{font-size:12.5px;color:var(--ink2);display:block;margin-bottom:4px}.campo input{width:100%;background:#0A2236;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px;font:inherit}
.semana{font-family:Sora;font-size:30px;font-weight:800}.fila{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.pill-push{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#63D6A6}
</style>
</head>
<body>
<header>
  <div class="logo"><svg viewBox="0 0 64 64" fill="none"><path d="M32 5 L59 28 V57 A3 3 0 0 1 56 60 H8 A3 3 0 0 1 5 57 V28 Z" fill="#fff"/><path d="M20 35 L29 44 L46 26" stroke="#F2621F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>resuelto<small>Proveedores</small></div>
  <div id="quien">…</div>
</header>
<main>
  <div class="aviso" id="aviso"></div>
  <div class="banner" id="b-push"><p><b>Activa las alertas</b>Te avisamos al celular en cuanto salga un trabajo en tu zona. El primero que acepta se lo lleva.</p><button id="btn-push">Activar</button></div>
  <div class="banner" id="b-install"><p><b>Instala la app</b>Añádela a tu pantalla de inicio para abrirla con un toque.</p><button id="btn-install">Instalar</button></div>
  <h2>Disponibles ahora</h2>
  <div id="abiertas"><div class="vacio">Cargando…</div></div>
  <h2>Mis trabajos</h2>
  <div id="mios"></div>
  <h2>Mi semana</h2>
  <div id="cuenta"><div class="vacio">Cargando…</div></div>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), p=q.get('p'), k=q.get('k');
  try{ if(p&&k){localStorage.setItem('resuelto_p',p);localStorage.setItem('resuelto_k',k);} else {p=localStorage.getItem('resuelto_p');k=localStorage.getItem('resuelto_k');} }catch(e){}
  var $=function(id){return document.getElementById(id)};
  var aviso=function(t,err){var a=$('aviso');a.textContent=t;a.className='aviso'+(err?' error':'');a.style.display='block';setTimeout(function(){a.style.display='none'},5000)};
  if(q.get('firmado')) aviso('Contrato '+q.get('firmado')+' firmado. ¡Listo para trabajar!');
  if(!p||!k){$('quien').textContent='Acceso inválido';$('abiertas').innerHTML='<div class="vacio">Abre una vez el enlace que te mandamos por WhatsApp (resueltopr) y la app te recuerda para siempre.</div>';return;}
  var money=function(n){return '$'+Number(n).toLocaleString('en-US')};
  var cuando=function(iso){return iso?new Date(iso).toLocaleString('es-PR',{timeZone:'America/Puerto_Rico',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'por coordinar'};
  function restante(iso){var ms=new Date(iso)-Date.now();if(ms<=0)return 'vencida';var m=Math.floor(ms/60000);return m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min'}
  var api=function(u,b){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({p:p,k:k},b))}).then(function(r){return r.json()})};
  var hora=function(iso){return new Date(iso).toLocaleTimeString('es-PR',{timeZone:'America/Puerto_Rico',hour:'numeric',minute:'2-digit'})};
  var ORDEN={'agendado':1,'en-camino':2,'en-sitio':3,'completado':4,'cobrado':4};
  function firmaDe(o){return o.contrato?(o.contrato.estado==='firmado'?'<span class="tag ok">Orden firmada</span>':(o.contrato.urlFirma?'<a class="btn line" href="'+o.contrato.urlFirma+'">✍️ Firmar orden de trabajo</a>':'')):''}
  function card(o,mia){
    var t=o.trabajo;
    var head='<div class="top"><div><b class="id">'+o.id+' · '+o.referencia+'</b><h3>'+o.categoriaNombre+'</h3><p>'+o.resumen+'</p></div><div class="pago">'+money(t&&t.pagoPlomero!=null?t.pagoPlomero:o.pagoProveedor)+'<small>tu pago</small></div></div>';
    if(!mia) return '<div class="card">'+head+'<div class="meta"><span>📍 '+o.municipio+'</span><span>📅 '+cuando(o.inicio)+'</span><span>⏳ <span class="timer">'+restante(o.expiraEn)+'</span></span></div><button class="btn" data-id="'+o.id+'">Aceptar este trabajo</button></div>';
    if(!t) return '<div class="card">'+head+'<div class="meta"><span>📍 '+o.municipio+'</span><span>📅 '+cuando(o.inicio)+'</span><span class="tag ok">Tuyo</span></div>'+firmaDe(o)+'</div>';
    var n=ORDEN[t.estado]||1, pasos='<div class="pasos">'+[1,2,3,4].map(function(x){return '<span class="'+(x<=n?'on':'')+'"></span>'}).join('')+'</div>';
    var tel=(t.telefono||'').replace(/\D/g,'');
    var cli='<div class="cli"><b>'+t.cliente+'</b><br>📞 <a href="tel:+'+tel+'">'+t.telefono+'</a> · <a href="https://wa.me/'+tel+'">WhatsApp</a><br>📍 <a href="https://maps.google.com/?q='+encodeURIComponent(t.direccion+', '+t.municipio+', PR')+'">'+t.direccion+', '+t.municipio+'</a>'+(t.referencia?'<br><span style="color:var(--ink2)">Ref: '+t.referencia+'</span>':'')+'<br>🕑 '+cuando(t.inicio)+' – '+hora(t.fin)+(t.emergencia?' <span class="tag warn">Emergencia</span>':'')+'<br>💲 '+(t.precioFijo!=null?'Precio fijo: $'+t.precioFijo+' mano de obra':'Por rango: $'+t.rango[0]+'–$'+t.rango[1]+' (tú pones el final)')+'</div>';
    var acc='';
    if(t.estado==='agendado') acc='<button class="btn" data-paso="en-camino" data-of="'+o.id+'">🚗 Voy en camino</button><p style="font-size:13px;color:var(--ink2);margin-top:8px">Le avisamos al cliente que vas.</p>';
    else if(t.estado==='en-camino') acc='<button class="btn" data-paso="llegue" data-of="'+o.id+'">📍 Llegué</button>';
    else if(t.estado==='en-sitio') acc='<div class="fotos"><label>📷 Antes ('+t.fotosAntes+')<input type="file" accept="image/*" capture="environment" multiple data-foto="antes" data-of="'+o.id+'"></label><label>📷 Después ('+t.fotosDespues+')<input type="file" accept="image/*" capture="environment" multiple data-foto="despues" data-of="'+o.id+'"></label></div>'
      +(t.precioFijo==null?'<div class="campo"><label>Mano de obra final ($'+t.rango[0]+'–$'+t.rango[1]+')</label><input type="number" inputmode="decimal" id="mo-'+o.id+'"></div>':'')
      +'<div class="campo"><label>Materiales que compraste ($, costo real con recibo)</label><input type="number" inputmode="decimal" id="mat-'+o.id+'" placeholder="0"></div>'
      +'<div class="campo"><label>Nota (opcional)</label><input id="nota-'+o.id+'" placeholder="Qué hiciste / algo a tener en cuenta"></div>'
      +'<button class="btn" data-paso="terminado" data-of="'+o.id+'">✅ Terminé — cobrarle al cliente</button>';
    else acc='<div class="cli">✅ Terminado. El cliente paga <b>'+money(t.totalCliente)+'</b> a Resuelto'+(t.estado==='cobrado'?' <span class="tag ok">Cobrado</span>':' <span class="tag warn">Pendiente de pago</span>')+'<br>Tú cobras <b>'+money(t.pagoPlomero)+'</b> el viernes.</div>';
    var notaLibre=(t.estado!=='completado'&&t.estado!=='cobrado')?'<div class="campo"><label>Comentario para Resuelto (lo ve el gerente)</label><input id="com-'+o.id+'" placeholder="Ej: el cliente pidió cotizar otra cosa, falta una pieza…"></div><button class="btn line" data-com="'+o.id+'">Enviar comentario</button>':'';
    return '<div class="card">'+head+pasos+cli+firmaDe(o)+acc+notaLibre+'</div>';
  }
  function achicar(file){return new Promise(function(ok,ko){var img=new Image();img.onload=function(){var m=1600,w=img.width,h=img.height,s=Math.min(1,m/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',0.8))};img.onerror=ko;img.src=URL.createObjectURL(file)})}
  function enlazar(){
    document.querySelectorAll('button[data-id]').forEach(function(b){b.onclick=function(){b.disabled=true;b.textContent='Aceptando…';
      api('/api/proveedores/aceptar',{oferta:b.dataset.id}).then(function(j){if(j.ok){aviso('✅ '+j.oferta.id+' es tuyo. Abajo en "Mis trabajos" tienes los datos del cliente.');}else{aviso(j.motivo||'No se pudo aceptar.',true);} cargar();});};});
    document.querySelectorAll('button[data-paso]').forEach(function(b){b.onclick=function(){
      var of=b.dataset.of,body={oferta:of,paso:b.dataset.paso};
      if(b.dataset.paso==='terminado'){var mo=$('mo-'+of),mat=$('mat-'+of),nt=$('nota-'+of);if(mo)body.mano_obra=Number(mo.value);body.materiales=Number(mat&&mat.value||0);body.nota=nt?nt.value:'';if(!confirm('¿Cerrar el trabajo y enviarle el cobro al cliente?'))return;}
      b.disabled=true;b.textContent='Enviando…';
      api('/api/proveedores/trabajo/paso',body).then(function(j){if(j.ok){aviso(j.estado==='completado'?'✅ Listo. Le enviamos el cobro de '+money(j.total)+' al cliente. Tú cobras '+money(j.pago)+' el viernes.':(j.recordatorio||'✅ Listo'));}else{aviso(j.motivo||'No se pudo.',true);} cargar();cuenta();});};});
    document.querySelectorAll('button[data-com]').forEach(function(b){b.onclick=function(){var of=b.dataset.com,i=$('com-'+of);if(!i||!i.value.trim())return;b.disabled=true;
      api('/api/proveedores/trabajo/nota',{oferta:of,texto:i.value}).then(function(j){aviso(j.ok?'💬 Comentario enviado.':(j.motivo||'No se pudo'),!j.ok);i.value='';b.disabled=false;});};});
    document.querySelectorAll('input[data-foto]').forEach(function(inp){inp.onchange=function(){
      var files=[].slice.call(inp.files||[]);if(!files.length)return;aviso('Subiendo '+files.length+' foto(s)…');
      files.reduce(function(pr,f){return pr.then(function(){return achicar(f).then(function(d){return api('/api/proveedores/trabajo/foto',{oferta:inp.dataset.of,tipo:inp.dataset.foto,imagen:d}).then(function(j){if(!j.ok)aviso(j.motivo,true)})})})},Promise.resolve()).then(function(){aviso('📷 Fotos guardadas.');cargar();});};});
  }
  function cargar(){
    fetch('/api/proveedores/ofertas?p='+encodeURIComponent(p)+'&k='+k).then(function(r){return r.json()}).then(function(j){
      if(j.error){$('quien').textContent='Acceso inválido';$('abiertas').innerHTML='<div class="vacio">'+j.error+'</div>';return;}
      $('quien').textContent=j.proveedor.nombre+' · '+(j.proveedor.tipo==='plomero'?'Plomero':'Contratista');
      var ab=j.ofertas.filter(function(o){return o.estado==='abierta'&&o.aceptadoPor!==p}), mi=j.ofertas.filter(function(o){return o.aceptadoPor===p});
      var activo=document.activeElement&&document.activeElement.tagName==='INPUT';if(activo)return;
      $('abiertas').innerHTML=ab.length?ab.map(function(o){return card(o,false)}).join(''):'<div class="vacio">Nada disponible ahora. Te avisamos al celular en cuanto salga algo en tu zona.</div>';
      $('mios').innerHTML=mi.length?mi.map(function(o){return card(o,true)}).join(''):'<div class="vacio">Todavía no tienes trabajos. Cuando aceptes uno, aquí ves al cliente y los pasos.</div>';
      enlazar();
    }).catch(function(){$('abiertas').innerHTML='<div class="vacio">No pude conectar. Intenta otra vez.</div>'});
  }
  function cuenta(){
    fetch('/api/proveedores/cuenta?p='+encodeURIComponent(p)+'&k='+k).then(function(r){return r.json()}).then(function(c){
      if(c.error)return; var s=c.estaSemana, f=new Date(s.pagoViernes+'T12:00:00').toLocaleDateString('es-PR',{weekday:'long',day:'numeric',month:'long'});
      $('cuenta').innerHTML='<div class="card"><p style="color:var(--ink2)">Esta semana · se paga el '+f+'</p><div class="semana">'+money(s.total)+'</div>'
        +(s.trabajos.length?s.trabajos.map(function(t){return '<div class="fila"><span>'+t.id+' · '+t.servicio+'</span><b>'+money(t.pago)+'</b></div>'}).join(''):'<p style="color:var(--ink3);margin-top:8px">Todavía no has cerrado trabajos esta semana.</p>')
        +'<p style="color:var(--ink2);font-size:13px;margin-top:10px">Semana pasada: '+money(c.anterior.total)+' · Acumulado: '+money(c.acumulado)+' en '+c.trabajosTotales+' trabajos</p></div>';
    });
  }
  cargar(); cuenta(); setInterval(cargar,20000);

  // ── App instalable + notificaciones push ──
  var urlB64=function(b){var p='='.repeat((4-b.length%4)%4),s=(b+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a};
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('/sw.js').then(function(reg){
      if(!('PushManager' in window)||!('Notification' in window))return;
      reg.pushManager.getSubscription().then(function(sub){
        if(sub){$('quien').innerHTML+=' <span class="pill-push">● alertas activas</span>';return;}
        if(Notification.permission==='denied')return;
        $('b-push').style.display='flex';
        $('btn-push').onclick=function(){
          fetch('/api/proveedores/push/clave').then(function(r){return r.json()}).then(function(j){
            if(!j.clave){aviso('Las alertas push no están configuradas todavía. Te avisamos por WhatsApp.',true);$('b-push').style.display='none';return;}
            return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(j.clave)}).then(function(sub){
              return fetch('/api/proveedores/push/suscribir',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p:p,k:k,sub:sub,dispositivo:navigator.userAgent.slice(0,80)})});
            }).then(function(){$('b-push').style.display='none';aviso('✅ Alertas activas. Te avisamos en cuanto salga un trabajo.');});
          }).catch(function(){aviso('No se pudieron activar las alertas en este navegador.',true)});
        };
      });
    });
  }
  var deferred=null;
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;$('b-install').style.display='flex';$('btn-install').onclick=function(){deferred.prompt();deferred=null;$('b-install').style.display='none';};});
  var esIOS=/iphone|ipad/i.test(navigator.userAgent), standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
  if(esIOS&&!standalone){$('b-install').style.display='flex';$('b-install').querySelector('p').innerHTML='<b>Instala la app en tu iPhone</b>Toca <strong>Compartir</strong> y luego <strong>Añadir a pantalla de inicio</strong>. Así recibes las alertas.';$('btn-install').style.display='none';}
})();
</script>
</body>
</html>
