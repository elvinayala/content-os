<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../feed/src/_base.css"><style>
html,body{height:1350px}
.chip{display:inline-block;background:rgba(255,255,255,.08);color:#DCE8F1;font-weight:600;font-size:24px;padding:12px 22px;border-radius:999px;margin:0 10px 12px 0}
.cupos{display:inline-flex;align-items:center;gap:14px;background:rgba(242,98,31,.14);border:2px solid rgba(242,98,31,.55);color:#FFB48E;font-weight:700;font-size:28px;padding:14px 26px;border-radius:999px}
.cupos b{width:14px;height:14px;border-radius:50%;background:#F2621F;display:inline-block}
.check{font-size:29px;margin-top:16px}
.cta{display:flex;align-items:center;gap:16px;background:#F2621F;color:#fff;font-weight:700;font-size:31px;padding:22px 34px;border-radius:20px;font-family:'Sora'}
</style></head><body class="navy" style="background:#071B2C"><div class="glow"></div>

<div class="eyebrow" style="margin-top:96px">Estamos contratando · Plomería</div>
<h1 style="font-size:100px;margin-top:24px">Buscamos plomero en</h1>
<h1 class="o fit" style="font-size:178px;margin-top:6px;white-space:nowrap">Caguas.</h1>
<div style="margin-top:30px"><span class="cupos"><b></b>Solo 2 cupos en la región</span></div>
<div style="margin-top:40px">
  <div class="check"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#3DD598" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Nosotros ponemos los clientes</div>
  <div class="check"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#3DD598" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Pagamos la publicidad</div>
  <div class="check"><i><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#3DD598" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Tú haces la plomería</div>
</div>
<div style="margin-top:38px"><span class="chip">Caguas</span><span class="chip">Gurabo</span><span class="chip">Juncos</span><span class="chip">San Lorenzo</span><span class="chip">Cayey</span><span class="chip">Aguas Buenas</span></div>

<div class="foot" style="align-items:center;border-top:1px solid rgba(255,255,255,.12);padding-top:30px">
  <div class="muted" style="font-size:24px;line-height:1.35;max-width:400px">Licencia vigente<br>(oficial o maestro)</div>
  <div class="cta"><svg width="36" height="36" viewBox="0 0 24 24"><path d="M3.5 6A3 3 0 0 1 6.5 3h11a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H10.2l-4.6 3.7c-.6.5-1.6.1-1.6-.7V17a3 3 0 0 1-.5-1.7z" fill="#fff"/><circle cx="8.3" cy="10" r="1.35" fill="#F2621F"/><circle cx="12" cy="10" r="1.35" fill="#F2621F"/><circle cx="15.7" cy="10" r="1.35" fill="#F2621F"/></svg>Escríbenos un mensaje</div>
</div>
<script>document.fonts.ready.then(()=>{for(const el of document.querySelectorAll('.fit')){let t=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth&&t>60){t-=2;el.style.fontSize=t+'px'}}})</script>
</body></html>
