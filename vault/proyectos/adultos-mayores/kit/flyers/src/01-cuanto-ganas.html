<!doctype html><html lang="es-PR"><head><meta charset="utf-8"><title>01 · Cuánto ganas</title>
<link rel="stylesheet" href="flyer.css">
<style>
.mid{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:56px 0 8px}
.money{display:flex;align-items:baseline;gap:26px;flex-wrap:nowrap}
.big{font-size:196px;line-height:.86;font-family:var(--display);font-weight:800;letter-spacing:-.05em;color:var(--c2)}
.to{font-family:var(--display);font-weight:800;font-size:88px;letter-spacing:-.035em;color:var(--c2);opacity:.72;white-space:nowrap}
.range{font-size:33px;font-weight:600;color:var(--c3);opacity:.9;margin-top:14px}
.rows{border-top:1px solid rgba(247,245,236,.24)}
.row{display:flex;justify-content:space-between;align-items:center;padding:26px 0;border-bottom:1px solid rgba(247,245,236,.24);font-size:28px}
.row b{font-family:var(--display);font-size:36px;color:var(--c2);font-weight:800}
.row span{opacity:.88}
</style></head><body>
<div class="canvas dark">
  <div class="brand"><svg viewBox="0 0 64 64"><path d="M32 6C17.6 6 6 16.3 6 29c0 7.3 3.9 13.8 10 18v11l10.6-6.4c1.8.3 3.6.4 5.4.4 14.4 0 26-10.3 26-23S46.4 6 32 6z" fill="#F7F5EC"/><path d="M32 40.5l-9.2-9.1c-2.6-2.6-2.6-6.8 0-9.3 2.5-2.5 6.6-2.5 9.2 0 2.6-2.5 6.7-2.5 9.2 0 2.6 2.5 2.6 6.7 0 9.3L32 40.5z" fill="#DE5F4D"/></svg>contigo <small>PR</small></div>
  <div class="mid">
    <div>
      <div class="eyebrow" style="color:var(--c2)">Cuidadoras · Puerto Rico</div>
      <h1 style="font-size:66px;margin-top:20px;max-width:15ch">Acompaña a los abuelos de tu barrio.</h1>
    </div>
    <div>
      <div class="money"><div class="big num">$390</div><div class="to num">a $700</div></div>
      <div class="range">a la semana, pagado los viernes</div>
    </div>
    <div class="rows">
      <div class="row"><span>Una visita de compañía</span><b class="num">$23</b></div>
      <div class="row"><span>Llevarla a la cita del médico</span><b class="num">$29</b></div>
      <div class="row"><span>Hacerle la compra</span><b class="num">$8</b></div>
      <div class="row"><span>Llevarle el plato caliente</span><b class="num">$4</b></div>
    </div>
  </div>
  <div class="foot">
    <div class="site">contigopr.com<span>/cuidadoras</span></div>
    <div class="cta">Tú escoges tus días<br>y tus horas.</div>
  </div>
</div></body></html>
