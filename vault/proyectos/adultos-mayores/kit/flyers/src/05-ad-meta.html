<!doctype html><html lang="es-PR"><head><meta charset="utf-8"><title>05 · Anuncio Meta</title>
<link rel="stylesheet" href="flyer.css">
<style>
.q{font-family:var(--display);font-weight:800;font-size:82px;line-height:.98;letter-spacing:-.04em;color:var(--c1);text-wrap:balance}
.q em{font-style:normal;color:var(--c6)}
.box{margin-top:auto;background:var(--c1);color:var(--c3);border-radius:30px;padding:46px 48px}
.box .l{font-size:23px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--c2)}
.box .big{font-family:var(--display);font-weight:800;font-size:96px;letter-spacing:-.045em;line-height:1;margin-top:12px}
.box .sub{font-size:28px;margin-top:10px;opacity:.86}
.tags{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.tag{border:2px solid rgba(23,70,58,.28);color:var(--c1);padding:13px 24px;border-radius:999px;font-size:24px;font-weight:600}
</style></head><body>
<div class="canvas light">
  <div class="brand" style="color:var(--c1)"><svg viewBox="0 0 64 64"><path d="M32 6C17.6 6 6 16.3 6 29c0 7.3 3.9 13.8 10 18v11l10.6-6.4c1.8.3 3.6.4 5.4.4 14.4 0 26-10.3 26-23S46.4 6 32 6z" fill="#17463A"/><path d="M32 40.5l-9.2-9.1c-2.6-2.6-2.6-6.8 0-9.3 2.5-2.5 6.6-2.5 9.2 0 2.6-2.5 6.7-2.5 9.2 0 2.6 2.5 2.6 6.7 0 9.3L32 40.5z" fill="#DE5F4D"/></svg>contigo <small>PR</small></div>
  <div style="margin-top:70px">
    <div class="eyebrow" style="color:#5F6B66">Metro Norte y Metro Oeste</div>
    <div class="q" style="margin-top:22px">¿Tienes carro, tiempo en la mañana y <em>paciencia con los viejitos?</em></div>
    <div class="tags">
      <div class="tag">Amas de casa</div>
      <div class="tag">Estudiantes de enfermería</div>
      <div class="tag">Retiradas</div>
    </div>
  </div>
  <div class="box">
    <div class="l">Tu parte, cada semana</div>
    <div class="big num">$390 a $700</div>
    <div class="sub">65% de cada servicio. Te pagamos los viernes.</div>
  </div>
  <div class="foot" style="border-color:rgba(23,70,58,.28);margin-top:34px">
    <div class="site" style="color:var(--c1)">contigopr.com<span>/cuidadoras</span></div>
    <div class="pill gold">Aplica en 3 min</div>
  </div>
</div></body></html>
