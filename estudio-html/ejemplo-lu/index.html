<!doctype html>
<html lang="es" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&display=swap" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0b0b0b; }
      #root { position: relative; width: 100%; height: 100%; font-family: Sora, sans-serif; color: #f5f1e8; }
      .clip { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }
      #logo { width: 520px; }
      .linea { font-size: 104px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.04; text-align: center; }
      .linea span { display: inline-block; }
      .oro { color: #f5ce1a; }
      #barra { width: 0; height: 10px; background: #f5ce1a; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1920" data-height="1080">
      <div id="esc1" class="clip" data-start="0" data-duration="2.6" data-track-index="0">
        <div class="linea"><span>Tu</span> <span>negocio,</span></div>
        <div class="linea oro"><span>en</span> <span>otro</span> <span>nivel.</span></div>
        <div id="barra"></div>
      </div>
      <div id="esc2" class="clip" data-start="2.6" data-duration="3.4" data-track-index="0">
        <img id="logo" src="assets/lu.png" alt="Level Up Media" />
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from("#esc1 .linea span", { y: 80, opacity: 0, duration: 0.55, stagger: 0.09, ease: "power3.out" }, 0.1)
        .to("#barra", { width: 420, duration: 0.7, ease: "power2.inOut" }, 0.9)
        .to("#esc1", { opacity: 0, scale: 1.04, duration: 0.35, ease: "power2.in" }, 2.25)
        .from("#logo", { scale: 0.7, opacity: 0, duration: 0.8, ease: "back.out(1.6)" }, 2.7)
        .to("#logo", { scale: 1.04, duration: 2.2, ease: "none" }, 3.5);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
