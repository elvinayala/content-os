<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#050e0a;color:#e8f3ec;font-family:'Inter',system-ui,sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:radial-gradient(800px 500px at 88% 0%,rgba(43,255,136,.15),transparent 60%),radial-gradient(600px 420px at 0% 100%,rgba(255,138,91,.14),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(43,255,136,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(43,255,136,.06) 1px,transparent 1px);background-size:60px 60px;opacity:.5;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse at 30% 40%,#000 0,transparent 75%)}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;font:600 20px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#8fb3a0}
.top b{color:#2bff88;font-weight:600}
h1{font-family:'Outfit',sans-serif;font-weight:700;font-size:82px;line-height:1.02;letter-spacing:-.025em;max-width:1010px;text-wrap:balance}
h1 em{font-style:normal;color:#2bff88;}
.sub{margin-top:26px;font-size:30px;line-height:1.35;color:#8fb3a0;max-width:1010px}
.bot{display:flex;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:12px;background:#2bff88;color:#04140b;font:600 21px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:16px 26px;border-radius:999px}
.url{font:600 22px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#8fb3a0;text-transform:uppercase}

</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="top"><span><b>●</b>&nbsp; Elvin Ayala · IA</span><span>Auditoría · 1 minuto</span></div>
  <div><h1>¿Tu negocio todavía depende de que <em>alguien conteste</em>?</h1><p class="sub">Descubre qué puedes automatizar con IA: agentes personalizados, sistemas a la medida y capacitación.</p></div>
  <div class="bot"><span class="pill">Auditar mi operación →</span><span class="url">elvinayala.com</span></div>
</div></body></html>
