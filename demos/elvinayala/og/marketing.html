<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#0b0b0b;color:#f5f1e8;font-family:'Inter',system-ui,sans-serif;position:relative;-webkit-font-smoothing:antialiased}
.glow{position:absolute;inset:0;background:radial-gradient(900px 520px at 90% 0%,rgba(242,193,78,.17),transparent 60%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(245,241,232,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(245,241,232,.06) 1px,transparent 1px);background-size:60px 60px;opacity:.5;-webkit-mask-image:radial-gradient(ellipse at 30% 40%,#000 0,transparent 75%);mask-image:radial-gradient(ellipse at 30% 40%,#000 0,transparent 75%)}
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;justify-content:space-between;font:600 20px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#a3a3a3}
.top b{color:#f2c14e;font-weight:600}
h1{font-family:'Sora',sans-serif;font-weight:800;font-size:78px;line-height:1.02;letter-spacing:-.03em;max-width:1010px;text-wrap:balance}
h1 em{font-style:normal;color:#f2c14e;}
.sub{margin-top:26px;font-size:30px;line-height:1.35;color:#a3a3a3;max-width:1010px}
.bot{display:flex;align-items:center;justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:12px;background:#f2c14e;color:#0b0b0b;font:600 21px 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;padding:16px 26px;border-radius:999px}
.url{font:600 22px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#a3a3a3;text-transform:uppercase}

</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="top"><span><b>●</b>&nbsp; Elvin Ayala · Marketing</span><span>Auditoría · 1 minuto</span></div>
  <div><h1>¿Tu negocio ya vende pero depende de <em>referidos</em>?</h1><p class="sub">Audita tu marketing y recibe un plan de acción de 14 días en menos de 1 minuto.</p></div>
  <div class="bot"><span class="pill">Auditar mi marketing →</span><span class="url">elvinayala.com</span></div>
</div></body></html>
